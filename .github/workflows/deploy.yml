name: Build and Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image inside minikube's Docker daemon
        working-directory: backend
        run: |
          eval $(minikube docker-env)
          docker build -t sample-backend:v1 .
          docker images | grep sample-backend

      - name: Restart backend deployment (picks up new image)
        run: |
          kubectl rollout restart deployment/backend -n dev
          kubectl rollout status deployment/backend -n dev --timeout=90s

      - name: Show final pod status
        run: |
          kubectl get pods -n dev
          kubectl logs -n dev deployment/backend --tail=20
